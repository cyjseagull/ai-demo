[llm]
api_key = "YOUR_API_KEY"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.ai"
temperature = 0.7

[agent]
max_iterations = 5
system_prompt = """
You are a helpful assistant.
"""
debug = true
verbose = true
max_execution_time = 60
handle_parsing_errors = true
return_intermediate_steps = true

[context.cache]
enable = true
backend = "sqlite"
path = "data/context_cache.db"
max_sessions = 50
max_messages_per_session = 200
max_context_messages = 30
trim_strategy = "sliding_window"
recent_window_size = 20
summary_trigger_messages = 50

[context.rag]
enable = false
backend = "sqlite_vec"
embed_model = "local:bge-small-zh"
top_k = 4
recent_boost = 0.3
min_relevance = 0.25

[log]
level = "INFO"
path = "logs/app.log"

[search]
enable = false
provider = "duckduckgo"
max_results = 3

[tools.save_file]
base_dir = "outputs"
