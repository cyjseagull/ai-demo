[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-toolkit"
version = "0.1.0"
dependencies = [
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "langchain",
  "langchain-openai",
  "langchain-community",
  "ddgs",
  "deepagents",
  "pydantic>=2.0",
  "prompt-toolkit",
  "rich"
]

[project.optional-dependencies]
embeddings = ["sentence-transformers"]

[tool.setuptools]
packages = ["config", "component"]
package-dir = {"" = "src"}